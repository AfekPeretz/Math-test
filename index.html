<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מחולל מבחנים כיתה ה׳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap">
<style>
/* Layout: math-notebook squared paper behind a settings rail + a live A4 "paper" preview; archive of every generated test below the controls */
:root{
  --bg:#EEF2F5; --grid:#DCE4EB; --panel:#FFFFFF; --ink:#1B2B3A; --muted:#5C6B78; --line:#CBD5DE;
  --accent:#C8412B; --accent-ink:#FFFFFF; --accent-soft:#F7E3DE; --navy:#1F4060; --navy-soft:#E1E9F1;
  --ok:#2F7A4F;
  --paper:#FFFFFF; --paper-ink:#141414; --paper-line:#BFBFBF; --paper-sq:#E3E9EE;
  --f-display:"Secular One","Assistant",Arial,sans-serif;
  --f-body:"Assistant",Arial,"Noto Sans Hebrew",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111920; --grid:#1A242E; --panel:#17212B; --ink:#E4EBF1; --muted:#97A6B3; --line:#2B3846;
  --accent:#F0715A; --accent-ink:#1A0E0B; --accent-soft:#3A221D; --navy:#8DB4DA; --navy-soft:#1E2E3E; --ok:#6CC495;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111920; --grid:#1A242E; --panel:#17212B; --ink:#E4EBF1; --muted:#97A6B3; --line:#2B3846;
  --accent:#F0715A; --accent-ink:#1A0E0B; --accent-soft:#3A221D; --navy:#8DB4DA; --navy-soft:#1E2E3E; --ok:#6CC495;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
.app{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0;color:var(--navy);text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:13px;font-weight:800;color:var(--muted);margin:0;letter-spacing:.04em}
.gen{width:100%;font:inherit;font-family:var(--f-display);font-size:20px;padding:14px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.gen:hover{filter:brightness(1.06)}
.gen:disabled{opacity:.6;cursor:wait}
.btn{font:inherit;font-weight:700;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--panel)}
.btn:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
.two{display:grid;grid-template-columns:1fr 110px;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;font:inherit;font-weight:700;padding:7px 6px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy-soft);color:var(--navy)}
.seg button+button{border-inline-start:1px solid var(--line)}
.tg{display:flex;flex-direction:column;gap:4px}
.tg-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;color:var(--navy);margin-top:4px}
.tg-h button{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:underline}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;padding:2px 0}
.chk input{width:17px;height:17px;accent-color:var(--accent);margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.ok{color:var(--ok)} .status.err{color:var(--accent)}
.arch{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;resize:vertical;min-height:70px}
.hint{font-size:13px;color:var(--muted);margin:0}
.filebtn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn span{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebtn:focus-within span{outline:2px solid var(--accent);outline-offset:2px}
.found{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.found .d{font-size:12px;color:var(--muted);margin-inline-start:25px;margin-top:-4px}
.chk .rm{margin-inline-start:auto;font:inherit;font-size:12px;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:5px}
.chk .rm.arm{background:var(--accent);color:var(--accent-ink)}
.chk.off{opacity:.55}
.ai-tag{font-size:11px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-inline-start:6px}
.arch-note{font-size:12px;color:var(--muted)}
.arch-empty{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:10px}
.ai{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ai.cur{border-color:var(--accent);background:var(--accent-soft)}
.ai .t{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai .m{grid-column:1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ai .acts{grid-row:1/3;grid-column:2;display:flex;gap:4px}
.ai .acts button{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 7px;cursor:pointer}
.ai .acts button.del{color:var(--accent)}
.ai .acts button.del.arm{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.preview{min-width:0}
.pv-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pv-tag{font-size:13px;font-weight:700;color:var(--muted)}
.pv-tag b{color:var(--accent)}
.scaler{position:relative;width:100%;overflow:hidden}
.scaler>.sheet{transform-origin:top right;position:absolute;top:0;right:0;box-shadow:0 6px 24px rgba(20,40,60,.18)}

/* ===== The paper (always paper-white, prints in black) ===== */
.sheet{width:760px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;padding:34px 38px;direction:rtl}
.sheet .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-variant-numeric:tabular-nums}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2.5px solid var(--paper-ink);padding-bottom:12px}
.sh-head h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;margin:0}
.sh-head .sub{font-size:14px;margin-top:4px}
.sh-fields{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:14px;min-width:200px}
.sh-fields span{display:flex;gap:6px;align-items:flex-end}
.sh-fields i{flex:1;border-bottom:1.5px solid var(--paper-ink);height:1em}
.instr{font-size:14px;margin:10px 0 4px}
.part{font-family:var(--f-display);font-weight:400;font-size:19px;margin:20px 0 4px;padding:3px 10px;border-inline-start:5px solid var(--paper-ink);background:#F1F1F1}
.q{display:flex;gap:10px;padding:12px 0 14px;border-bottom:1px dashed var(--paper-line);break-inside:avoid;page-break-inside:avoid}
.q .n{flex:0 0 28px;height:28px;border:2px solid var(--paper-ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.q .b{flex:1;min-width:0}
.q .b p{margin:0 0 6px}
.q .tag{font-size:11.5px;font-weight:700;color:#666;margin-bottom:2px}
.sub-q{display:flex;gap:6px;margin:6px 0}
.sub-q>b{flex:0 0 auto}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.subs.one{grid-template-columns:1fr}
.blank{display:inline-block;min-width:56px;border-bottom:1.5px solid var(--paper-ink);height:1.15em;vertical-align:-3px;margin:0 3px}
.blank.s{min-width:34px}
.work{height:64px;margin-top:6px;border:1px solid #D6D6D6;background-color:#FFF;
  background-image:linear-gradient(var(--paper-sq) 1px,transparent 1px),linear-gradient(90deg,var(--paper-sq) 1px,transparent 1px);background-size:16px 16px}
.work.tall{height:96px}
.calcs{display:flex;gap:40px;flex-wrap:wrap;justify-content:flex-start;margin-top:6px}
.calc{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.vert{border-collapse:collapse;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.vert td{width:24px;height:26px;text-align:center;border:1px solid var(--paper-sq);padding:0}
.vert tr.sum td{border-top:2.5px solid var(--paper-ink)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;margin:0 2px;font-size:.95em}
.fr>span{padding:0 3px}
.fr>span:first-child{border-bottom:1.6px solid currentColor}
.mx{display:inline-flex;align-items:center;gap:1px}
.expr{font-size:17px;font-weight:600}
.fig{margin:6px 0;max-width:100%}
.fig svg{display:block;max-width:100%;height:auto}
.figs{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.figs .cap{text-align:center;font-weight:700;margin-top:2px}
table.t{border-collapse:collapse;margin-top:6px;font-size:15px}
table.t th,table.t td{border:1.3px solid var(--paper-ink);padding:4px 10px;text-align:center;min-width:44px}
table.t th{background:#F1F1F1;font-weight:800}
table.t td.l{text-align:right}
.tf{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted #CCC}
.tf span:last-child{white-space:nowrap;font-weight:700;font-size:13.5px}
.box{display:inline-block;width:18px;height:20px;border:1.5px solid var(--paper-ink);vertical-align:-4px;margin:0 1px}
.key{break-before:page;page-break-before:always;padding-top:4px}
.key h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px;border-bottom:2.5px solid var(--paper-ink);padding-bottom:8px}
.key ol{list-style:none;padding:0;margin:8px 0 0}
.key li{break-inside:avoid;page-break-inside:avoid;padding:6px 0;border-bottom:1px dashed var(--paper-line);display:flex;gap:8px}
.key li>b{flex:0 0 22px}
.key li>div{flex:1;min-width:0}
.key table.t{font-size:13px}
.key table.t th,.key table.t td{padding:2px 6px;min-width:26px}
.q.ph .b p{color:#666;font-style:italic}
.foot{margin-top:18px;text-align:center;font-weight:700;font-size:14px}
@media print{
  @page{size:A4;margin:12mm 10mm}
  body{background:#fff}
  .top,.panel,.pv-bar{display:none!important}
  .app{padding:0;max-width:none}
  .layout{display:block}
  .scaler{height:auto!important;overflow:visible}
  .scaler>.sheet{position:static;transform:none!important;box-shadow:none;width:auto;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="app" dir="rtl">
  <header class="top">
    <div>
      <h1>מחולל מבחנים במתמטיקה</h1>
      <p>כיתה ה׳ · כל הנושאים מרשימת המבחן של 2.11 · מבחן חדש בכל לחיצה</p>
    </div>
  </header>

  <div class="layout">
    <aside class="panel">
      <div class="card">
        <button class="gen" id="genBtn" type="button">ג׳נרט מבחן</button>
        <div class="row">
          <button class="btn primary" id="pdfBtn" type="button">הורדת PDF</button>
          <button class="btn" id="printBtn" type="button" hidden>הדפסה</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </div>

      <div class="card">
        <h2>הגדרות</h2>
        <div class="seg" role="group" aria-label="סוג הדף">
          <button type="button" id="modeTest" aria-pressed="true">מבחן</button>
          <button type="button" id="modeWs" aria-pressed="false">דף עבודה</button>
        </div>
        <div class="two">
          <label class="f">כותרת<input type="text" id="title" value="מבחן במתמטיקה"></label>
          <label class="f">תאריך<input type="text" id="date" value="2.11"></label>
        </div>
        <div class="f" style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)">שאלות לכל נושא
          <div class="seg" role="group" aria-label="שאלות לכל נושא" id="qptSeg">
            <button type="button" data-v="1" aria-pressed="true">1</button>
            <button type="button" data-v="2" aria-pressed="false">2</button>
            <button type="button" data-v="3" aria-pressed="false">3</button>
          </div>
        </div>
        <label class="chk"><input type="checkbox" id="keyChk" checked> דף פתרונות בסוף</label>
      </div>

      <div class="card">
        <h2>נושאים</h2>
        <div id="topics"></div>
      </div>

      <div class="card" id="addCard" hidden>
        <h2>הוספת נושאים</h2>
        <p class="hint">הדביקו טקסט או העלו צילום של הודעת המורה. Claude יזהה את הנושאים ויוסיף לרשימה רק את מה שעוד אין בה.</p>
        <textarea id="addText" rows="3" placeholder="למשל: מספרים עשרוניים, נפח של תיבה"></textarea>
        <label class="filebtn" id="addImgWrap" hidden><input type="file" id="addImg" accept="image/*"><span id="addImgName">📷 הוספת תמונה</span></label>
        <button class="btn primary" id="addBtn" type="button">זהה נושאים</button>
        <div id="addOut"></div>
      </div>

      <div class="card">
        <h2>ארכיון מבחנים</h2>
        <div class="arch" id="arch"><div class="arch-empty">טוען את הארכיון…</div></div>
        <div class="arch-note" id="archNote"></div>
      </div>
    </aside>

    <main class="preview">
      <div class="pv-bar"><div class="pv-tag" id="pvTag"></div></div>
      <div class="scaler" id="scaler"><div class="sheet" id="sheet"></div></div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
/* ---------- seeded randomness ---------- */
let R=Math.random;
function seedRng(s){let a=s>>>0;R=function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>n.toLocaleString('en-US');
const gcd=(a,b)=>b?gcd(b,a%b):a;
const L=s=>`<span class="ltr" dir="ltr">${s}</span>`;
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mx">${w}${fr(n,d)}</span>`;
const BL='<span class="blank"></span>', BS='<span class="blank s"></span>';
const HL=['א','ב','ג','ד','ה','ו'];
const INK='#141414', SHADE='#9A9A9A', SVGF='font-family="Assistant,Arial,sans-serif" direction="ltr"';
function frVal(n,d){ // simplified, mixed when > 1
  if(n===0)return '0';const g=gcd(n,d),N=n/g,D=d/g;
  if(D===1)return String(N);
  if(N>D)return mx(Math.floor(N/D),N%D,D);
  return fr(N,D);
}
function frShow(n,d){const g=gcd(n,d);return g>1||n>d?`${fr(n,d)} = ${frVal(n,d)}`:fr(n,d)}
const subs=(items,one)=>`<div class="subs${one?' one':''}">${items.map((h,i)=>`<div class="sub-q"><b>${HL[i]}.</b><div>${h}</div></div>`).join('')}</div>`;
const ansList=items=>items.map((h,i)=>`${HL[i]}. ${h}`).join('<br>');

function vert(nums,op,extra,minW){
  const s=nums.map(String);let w=Math.max(...s.map(x=>x.length))+1;if(minW)w=Math.max(w,minW);
  let rows='';
  s.forEach((x,i)=>{const c=[];for(let k=0;k<w;k++){const idx=k-(w-x.length);c.push(idx>=0?x[idx]:'')}
    if(i===s.length-1)c[0]=op;rows+=`<tr>${c.map(v=>`<td>${v}</td>`).join('')}</tr>`});
  for(let r=0;r<extra;r++)rows+=`<tr class="${r===0?'sum':''}">${'<td></td>'.repeat(w)}</tr>`;
  return `<table class="vert" dir="ltr">${rows}</table>`;
}

/* ---------- generators: each returns {q, a} ---------- */
function gMult(){
  const a=ri(124,986),b=ri(13,89),p=a*b;
  return {q:`<p>פתרו בכפל במאונך:</p><div class="calcs"><div class="calc">${vert([a,b],'×',4,String(p).length+1)}</div></div>`,
    a:L(`${a} × ${b} = ${fmt(p)}`)};
}
function gDistrib(i){
  const v=i%3;
  if(v===0){const a=ri(3,9),t=ri(2,9)*10,u=ri(1,9),b=t+u;
    return {q:`<p>חשבו בעזרת חוק הפילוג (פרקו את המספר לעשרות ויחידות):</p><p class="expr">${L(`${a} × ${b} = ${a} × (${BS} + ${BS}) = ${BL} + ${BL} = ${BL}`)}</p>`,
      a:L(`${a} × (${t} + ${u}) = ${a*t} + ${a*u} = ${a*b}`)}}
  if(v===1){const a=ri(12,85),m=pick([99,98,101,19,21]),base=m>50?100:20,d=m-base;
    const sign=d<0?'−':'+',ad=Math.abs(d);
    return {q:`<p>חשבו בדרך מקוצרת בעזרת חוק הפילוג:</p><p class="expr">${L(`${a} × ${m} = ${a} × (${base} ${sign} ${ad}) = ${BL}`)}</p>`,
      a:L(`${a} × (${base} ${sign} ${ad}) = ${a*base} ${sign} ${a*ad} = ${fmt(a*m)}`)}}
  const a=ri(12,49),tot=pick([10,100]),b=tot===10?ri(2,8):ri(21,79),c=tot-b;
  return {q:`<p>חשבו בדרך הקצרה ביותר. רמז: חוק הפילוג.</p><p class="expr">${L(`${a} × ${b} + ${a} × ${c} = ${BL}`)}</p>`,
    a:L(`${a} × (${b} + ${c}) = ${a} × ${tot} = ${fmt(a*tot)}`)};
}
function gDiv(i){
  const v=i%3;
  if(v===0){const d=ri(3,9),q=ri(112,1100),n=d*q;

function isolateNums(root){

  while(w.nextNode()){const n=w.currentNode;if(!HEB.test(n.data)||n.parentElement.closest('.ltr,svg,style'))continue;nodes.push(n)}
  nodes.forEach(n=>{const parts=n.data.split(/(\s+)/);if(!parts.some(t=>t.trim()&&!HEB.test(t)))return;
    const f=document.createDocumentFragment();let buf='';
    parts.forEach(t=>{if(t.trim()&&!HEB.test(t)&&/[0-9✓✗]/.test(t)){if(buf)f.append(buf);buf='';const sp=document.createElement('span');sp.textContent=t;f.append(sp)}else buf+=t});

async function writeCustomQs(cids,qpt){

For EACH topic below write exactly ${want} questions, in Hebrew, at Israeli grade-5 level.
Rules:

- Each question has ONE correct answer.
- Geometry (shapes, sides, angles, area, perimeter, lines, grids) MUST include a drawing in "fig" (format below). Any other question that a student would expect to see drawn may include one too; otherwise omit "fig".
- The drawing must agree with the text: same vertex letters, same measurements, roughly true proportions. Never show in the drawing the value the student is asked to find (write "?" there instead).
- Vary them: some direct exercises, some short word problems; easy to medium difficulty.
- Do not repeat or closely resemble any question in that topic's "avoid" list.
- Put each standalone arithmetic expression on its own line.
- "a" is the final answer followed by a very short solution (at most 15 words), in Hebrew.
Drawing format ("fig"), coordinates in grid units, x to the right, y upward, origin at bottom-left:
{"w":<width 2-16>,"h":<height 2-12>,"grid":<true to draw squared paper, e.g. for area by counting squares>,"items":[
  {"t":"poly","p":[[x,y],...],"v":["A","B",...],"s":["5 ס״מ",...],"r":[<vertex indices with a right angle>],"a":{"<vertex index>":"40°"},"fill":<true to shade>},
  {"t":"seg","p":[[x,y],[x,y]],"v":["A","B"],"s":"<label>"},
  {"t":"circle","c":[x,y],"r":<radius>,"s":"<label>"},
  {"t":"pt","p":[x,y],"v":"A"}]}
In "poly", "s"[i] labels the side from point i to point i+1 (use "" for no label). Keep labels short.

Reply with only JSON: {"topics":[{"id":"<topic id>","questions":[{"q":"...","a":"...","fig":{...}}]}]}

Topics:
${JSON.stringify(topics)}`,{cache:false});
  const out={};topics.forEach(t=>{const g=gen&&Array.isArray(gen.topics)?gen.topics.find(x=>x&&x.id===t.id):null;

  const items=[];for(const id in out)out[id].forEach((x,i)=>items.push(x.fig?{id,i,q:x.q,a:x.a,fig:x.fig}:{id,i,q:x.q,a:x.a}));

    const ver=await sample.json(`You are checking the answer key of a grade 5 math test (Israel, Hebrew).
For each item: first solve the question yourself, independently, without looking at the given answer. Then compare.
Set ok=true only if the question is clear, fits grade 5, has exactly one correct answer, and the given answer "a" is correct. If the item has a "fig" (a drawing: points in grid units, y upward; "s"[i] labels the side from point i to point i+1; "r" marks right angles), it must agree with the text and must not give away the answer. Otherwise ok=false.

${JSON.stringify(items)}`,{cache:false});

}

/* new test must not repeat any exact question from archived tests */
function freshSeed(){
  const old=new Set();archive.forEach(a=>{try{buildTest(a).qs.forEach(q=>old.add(q))}catch(e){}});
  let best=null,bestDup=1e9;
  for(let t=0;t<40;t++){const seed=Math.floor(Math.random()*2**31);const qs=buildTest(Object.assign(cfgNow(),{seed})).qs;
    const dup=qs.filter(q=>old.has(q)).length;if(dup<bestDup){best=seed;bestDup=dup}if(!dup)break}
  return best;
}
/* insert spacers so no question crosses an A4 page edge; the answer key starts on a new page */
function paginate(sh,sp){
  const pageH=sh.getBoundingClientRect().width*275/192;
  const blocks=[...sh.querySelectorAll('.sh-head,.instr,.part,.q,.foot,.key h3,.key li')];
  blocks.forEach((el,i)=>{
    const top0=sh.getBoundingClientRect().top,r=el.getBoundingClientRect();let top=r.top-top0,bot=r.bottom-top0;
    if(el.classList.contains('part')&&blocks[i+1])bot=blocks[i+1].getBoundingClientRect().bottom-top0;
    const pos=top%pageH;let gap=0;
    if(el.matches('.key h3')){gap=pos>1?pageH-pos:0}
    else if(bot-top<pageH&&Math.floor(top/pageH)!==Math.floor((bot-1)/pageH))gap=pageH-pos;
    if(gap>0){const d=document.createElement('div');d.style.height=gap+'px';if(el.matches('.key h3')){el.closest('.key').before(d)}else el.before(d);sp.push(d)}
  });
}
/* PDF only: one span per word, so the capture places each word where the browser laid it out */
function splitWords(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
  while(w.nextNode()){const n=w.currentNode;if(!n.data.trim()||n.parentElement.closest('svg,style'))continue;nodes.push(n)}
  nodes.forEach(n=>{const parts=n.data.split(/(\s+)/);if(parts.filter(t=>t.trim()).length<2&&parts.length<2)return;
    const f=document.createDocumentFragment();parts.forEach(t=>{if(!t)return;if(!t.trim())f.append(t);else{const sp=document.createElement('span');sp.textContent=t;f.append(sp)}});n.replaceWith(f)});
}
async function downloadPdf(){
  const btn=$('pdfBtn');btn.disabled=true;status('מכין קובץ PDF…');
  try{
    if(!downloads&&IN_CLAUDE){status('בתצוגה הזו אי אפשר להוריד קבצים. היכנסו ל-claude.ai או פתחו את גרסת האתר העצמאית.','err');return}
    const sh=$('sheet'),prev=sh.style.cssText;
    const P=CanvasRenderingContext2D.prototype,orig=P.fillText,HEB=/[\u0590-\u05FF]/;
    /* html2canvas draws each word left-to-right from its box's left edge; draw Hebrew words right-to-left from the right edge instead */
    P.fillText=function(t,x,y,...r){if(typeof t==='string'&&HEB.test(t)){const lead=(t.match(/^\s+/)||[''])[0],core=t.trim();
      const right=x+this.measureText(t).width-this.measureText(lead).width;this.save();this.direction='rtl';this.textAlign='right';orig.call(this,core,right,y,...r);this.restore();return}
      return orig.call(this,t,x,y,...r)};
    const sp=[];let blob,sx=0,sy=0;
    try{
      sh.style.transform='none';sh.style.width='192mm';sh.style.padding='0';sh.style.boxShadow='none';
      if(!sh.closest('.ltr'))splitWords(sh);paginate(sh,sp);sx=window.scrollX;sy=window.scrollY;window.scrollTo(0,0);
      blob=await html2pdf().set({margin:[10,9,12,9],image:{type:'jpeg',quality:.95},html2canvas:{scale:2,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:'legacy'}}).from(sh).outputPdf('blob')
    }finally{P.fillText=orig;sp.forEach(e=>e.remove());sh.style.cssText=prev;render();window.scrollTo(sx,sy)}
    const name=`${(state.title||'מבחן').replace(/[\\/:*?"<>|]/g,'')} כיתה ה.pdf`;
    if(!downloads){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);status('הקובץ ירד. פתחו אותו כדי להדפיס.','ok');return}
    try{await downloads.save({filename:name,data:blob});status('הקובץ ירד. פתחו אותו כדי להדפיס.','ok')}
    catch(err){status(err&&err.code==='declined'?'ההורדה בוטלה':'לא הצלחנו להוריד את הקובץ. נסו שוב.','err')}
  }catch(err){status('יצירת ה-PDF נכשלה. נסו שוב.','err')}
  finally{btn.disabled=false}
}
$('pdfBtn').addEventListener('click',downloadPdf);
if(!IN_CLAUDE){$('printBtn').hidden=false;$('printBtn').addEventListener('click',()=>window.print())}
$('modeTest').addEventListener('click',()=>{state.mode='test';if($('title').value==='דף עבודה – הכנה למבחן')$('title').value='מבחן במתמטיקה';syncSegs();settingsChanged()});
$('modeWs').addEventListener('click',()=>{state.mode='ws';if($('title').value==='מבחן במתמטיקה')$('title').value='דף עבודה – הכנה למבחן';syncSegs();settingsChanged()});
$('qptSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.qpt=+b.dataset.v;syncSegs();settingsChanged()});
$('topics').addEventListener('change',settingsChanged);
$('topics').addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(!b)return;const g=+b.dataset.g;
  const ids=b.dataset.g==='c'?customTopics.map(t=>t.id):TOPICS.filter(t=>t.g===g).map(t=>t.id);if(b.dataset.g==='c'&&!sample)return;const all=ids.every(id=>$('t_'+id).checked);ids.forEach(id=>$('t_'+id).checked=!all);settingsChanged()});
['title','date'].forEach(id=>$(id).addEventListener('input',()=>{readSettings();render()}));
$('keyChk').addEventListener('change',()=>{readSettings();render()});

/* ---------- boot ---------- */
renderTopics();state.seed=20261102;render();
window.__math5={buildTest,applySettings,render,state,TOPICS};
(async()=>{
  if(IN_CLAUDE){
    try{downloads=await window.claude.use('downloads')}catch(e){downloads=null}
    try{db=await window.claude.use('db')}catch(e){db=null}
    let canWrite=null;try{const u=await window.claude.use('user');canWrite=u?u.can('data.write'):null}catch(e){}
    if(db&&canWrite!==false)mode='shared';
    try{sample=await window.claude.use('sample')}catch(e){sample=null}
    if(sample){$('addCard').hidden=false;try{const lim=await sample.limits();$('addImgWrap').hidden=!(lim&&lim.images)}catch(e){}}
  }
  if(mode==='shared'){
    db.collection('topics').orderBy('createdAt','asc').onSnapshot(snap=>{const before=customTopics.map(t=>t.id).join();
      customTopics=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      const fresh=customTopics.filter(t=>before===''?!state.saved:!before.split(',').includes(t.id)).map(t=>t.id);
      if(fresh.length&&!state.saved)state.topics.push(...fresh.filter(id=>!state.topics.includes(id)));
      renderTopics();render()},()=>{customTopics=topicsLocalLoad();renderTopics()});
  } else {customTopics=topicsLocalLoad();if(!state.saved)state.topics.push(...customTopics.map(t=>t.id).filter(id=>!state.topics.includes(id)));renderTopics()}
  if(mode==='local'){useLocal();dbReady=true;
    if(archive.length&&archive[0].id!=='prep-worksheet'){applySettings(archive[0]);state.currentId=archive[0].id;state.saved=true}
    render();return}
  let first=true;
  db.collection('archive').orderBy('createdAt','desc').limit(200).onSnapshot(snap=>{
    if(mode!=='shared')return;
    archive=snap.docs.map(d=>Object.assign({id:d.id},d.data()));dbReady=true;
    if(first){first=false;if(archive.length&&!state.currentId&&archive[0].id!=='prep-worksheet'){applySettings(archive[0]);state.currentId=archive[0].id;state.saved=true}}
    if(state.saved&&!archive.find(a=>a.id===state.currentId)){state.saved=false;state.currentId=null}
    render();
  },()=>{useLocal();dbReady=true;render()});
})();
